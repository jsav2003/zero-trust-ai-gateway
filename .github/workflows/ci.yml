name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No services block: conftest.py sets GATEWAY_API_KEY and DATABASE_URL
      # before the app is imported, and both the SQLAlchemy engine and the
      # Gemini client are lazy, so the suite never opens a connection.
      - name: Run tests
        run: pytest -q
