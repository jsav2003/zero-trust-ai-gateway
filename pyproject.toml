[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-gateway"
version = "0.1.0"
description = "Zero Trust Cognitive AI Gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "langgraph>=0.0.65",
    "langchain-core>=0.2.0",
    "langchain-google-genai>=4.2.7",
    "alembic>=1.13.0"
]

[project.optional-dependencies]
# httpx is already present transitively; declared here because TestClient
# requires it directly. No pytest-asyncio: TestClient is synchronous.
dev = [
    "pytest>=8.0",
    "httpx>=0.27"
]

# Flat layout: setuptools sees app/, migrations/, tests/ and docs/ at the top
# level and refuses to guess which are the package. Only app/ ships; migrations/
# is run by Alembic from the working tree and tests/ is not distributed.
# app/ has no __init__.py, so namespace discovery has to stay enabled (default).
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
