[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-gateway"
version = "0.1.0"
description = "Zero Trust Cognitive AI Gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "langgraph>=0.0.65",
    "langchain-core>=0.2.0",
    "alembic>=1.13.0"
]
